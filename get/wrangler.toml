# get.boson.chat: `curl -fsSL https://get.boson.chat | sudo sh` gets the
# stack's install.sh; a browser gets a short page with that command.
# Deployed by .github/workflows/deploy.yml (job "get") on push to main.
name = "boson-get"
main = "worker.js"
compatibility_date = "2024-12-01"
workers_dev = false
# The get.boson.chat custom domain is attached in the Cloudflare dashboard
# (Workers > boson-get > Domains): the CI token can deploy scripts but not
# edit the zone's routes. No `routes` here, so `wrangler deploy` leaves it be.
